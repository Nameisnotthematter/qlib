<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="通过简洁界面探索并运行 Qlib 量化研究工作流。" />
    <title>Qlib 工作台</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Qlib 工作台首页">
        <span class="brand-mark">Q</span>
        <span>Qlib 工作台</span>
      </a>
      <span class="local-badge"><i></i>仅在本机运行</span>
    </header>

    <main>
      <section class="assistant-panel" aria-labelledby="assistant-title">
        <div class="eyebrow">自然语言助手</div>
        <h1 id="assistant-title">你想用 Qlib 做什么？</h1>
        <p class="intro">描述目标，我会从可用工作流中推荐下一步。命令只会在你确认后执行。</p>
        <form id="ask-form" class="ask-form">
          <label class="sr-only" for="query">描述你的量化研究目标</label>
          <textarea id="query" rows="2" maxlength="500" placeholder="例如：我想先看看本地有哪些行情数据"></textarea>
          <button type="submit" class="primary-button">查找工作流</button>
        </form>
        <div class="suggestions" aria-label="常用问题">
          <button type="button" data-query="我的环境准备好了吗？">环境准备好了吗？</button>
          <button type="button" data-query="查看最新股票行情">查看最新行情</button>
          <button type="button" data-query="我想训练模型并回测收益">训练模型并回测</button>
        </div>
        <div id="assistant-answer" class="assistant-answer" hidden></div>
      </section>

      <section class="workspace" aria-labelledby="workflow-title">
        <div class="section-heading">
          <div>
            <div class="eyebrow">可执行能力</div>
            <h2 id="workflow-title">选择工作流</h2>
          </div>
          <span id="catalog-count" class="count"></span>
        </div>
        <div id="workflow-grid" class="workflow-grid" aria-live="polite"></div>
      </section>
    </main>

    <dialog id="run-dialog" class="run-dialog">
      <div class="dialog-header">
        <div>
          <div id="dialog-category" class="eyebrow"></div>
          <h2 id="dialog-title"></h2>
        </div>
        <button id="close-dialog" type="button" class="icon-button" aria-label="关闭">×</button>
      </div>
      <p id="dialog-description" class="dialog-description"></p>
      <div class="detail-row">
        <span>预计耗时</span>
        <strong id="dialog-duration"></strong>
      </div>
      <div class="command-block">
        <div class="command-label">将执行以下命令</div>
        <code id="dialog-command"></code>
      </div>
      <div id="run-state" class="run-state" hidden>
        <div class="run-state-heading">
          <span id="status-pill" class="status-pill"></span>
          <button id="cancel-run" type="button" class="text-button" hidden>停止任务</button>
        </div>
        <pre id="run-output" tabindex="0"></pre>
      </div>
      <div class="dialog-actions">
        <button id="dismiss-dialog" type="button" class="secondary-button">返回</button>
        <button id="confirm-run" type="button" class="primary-button">确认并运行</button>
      </div>
    </dialog>

    <template id="workflow-template">
      <article class="workflow-card">
        <div class="card-meta">
          <span class="category"></span>
          <span class="duration"></span>
        </div>
        <h3></h3>
        <p class="description"></p>
        <div class="outcome"></div>
        <button type="button" class="card-action">查看并运行 <span aria-hidden="true">→</span></button>
      </article>
    </template>

    <script src="/app.js" defer></script>
  </body>
</html>
